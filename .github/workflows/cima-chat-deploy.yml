name: Deploy cima-chat widget

on:
  push:
    branches: [main]
    paths:
      - 'widgets/cima-chat/src/**'
      - 'widgets/cima-chat/public/**'
      - 'widgets/cima-chat/index.html'
      - 'widgets/cima-chat/package.json'
      - 'widgets/cima-chat/vite.config.ts'
      - 'widgets/cima-chat/tsconfig.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cima-chat-deploy.yml'
  workflow_dispatch:

concurrency:
  group: cima-chat-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter cima-chat...

      # Si el inventario no responde no se publica: mejor el chat de antes que uno
      # apuntando a una dirección rota.
      - name: Check inventory endpoint
        run: |
          curl -fsS --max-time 30 "$VITE_INVENTORY_URL" -o inventario.json
          node -e 'const j=require("./inventario.json"); if(!Array.isArray(j.items)) throw new Error("respuesta sin items"); console.log("items:", j.items.length, "updatedAt:", j.updatedAt)'
        env:
          VITE_INVENTORY_URL: https://cima-inventory-sync.larokifarmdigital.workers.dev/inventory

      - name: Build widget
        run: pnpm --filter cima-chat build
        env:
          VITE_INVENTORY_URL: https://cima-inventory-sync.larokifarmdigital.workers.dev/inventory

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Solo el hash: el mensaje del commit puede tener varias líneas y rompía
          # el comando de wrangler (todos los despliegues fallaban desde 11-11).
          command: pages deploy widgets/cima-chat/dist --project-name=larokifarm-cima-chat --branch=main --commit-hash=${{ github.sha }}
