name: Deploy cima-chat widget

on:
  push:
    branches: [main]
    paths:
      - 'widgets/cima-chat/src/**'
      - 'widgets/cima-chat/public/**'
      - 'widgets/cima-chat/index.html'
      - 'widgets/cima-chat/package.json'
      - 'widgets/cima-chat/vite.config.ts'
      - 'widgets/cima-chat/tsconfig.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cima-chat-deploy.yml'
  workflow_dispatch:

concurrency:
  group: cima-chat-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter cima-chat...

      - name: Build widget
        run: pnpm --filter cima-chat build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy widgets/cima-chat/dist --project-name=larokifarm-cima-chat --branch=main --commit-message="${{ github.event.head_commit.message || 'manual deploy' }}"
